<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#1769e0">

<title>Ma position GPS</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, sans-serif;

    background: #f3f6fa;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.container {

    width: 100%;
    max-width: 430px;

    background: white;

    border-radius: 24px;

    padding: 30px 25px;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.12);

    text-align: center;
}

.logo {
    font-size: 55px;
}

h1 {
    margin: 5px 0 10px;
    font-size: 28px;
    color: #172033;
}

.description {
    color: #687386;
    line-height: 1.5;
    margin-bottom: 25px;
}

button {

    width: 100%;

    border: none;

    border-radius: 15px;

    padding: 18px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;
}

#gpsButton {

    background: #1769e0;

    color: white;
}

#gpsButton:disabled {
    opacity: 0.6;
}

#status {

    margin-top: 20px;

    font-weight: bold;

    min-height: 25px;
}

.ok {
    color: #087443;
}

.error {
    color: #b42318;
}

.result {

    display: none;

    margin-top: 20px;

    text-align: left;
}

.coordinate {

    background: #f3f6fa;

    border-radius: 12px;

    padding: 14px;

    margin-bottom: 10px;
}

.label {

    font-size: 12px;

    color: #687386;
}

.value {

    font-size: 21px;

    font-weight: bold;

    margin-top: 5px;
}

.accuracy {

    text-align: center;

    color: #687386;

    margin: 15px 0;
}

.copy {

    background: #e8edf5;

    color: #172033;

    margin-top: 5px;
}

.maps {

    display: block;

    text-align: center;

    text-decoration: none;

    background: #16803c;

    color: white;

    border-radius: 15px;

    padding: 16px;

    font-weight: bold;

    margin-top: 10px;
}

.info {

    margin-top: 20px;

    font-size: 12px;

    color: #87909f;

    line-height: 1.5;
}

</style>

</head>


<body>

<div class="container">

<div class="logo">
📍
</div>

<h1>
Ma position GPS
</h1>

<div class="description">

Cliquez sur le bouton ci-dessous
pour transmettre votre position.

</div>


<button id="gpsButton">

ENREGISTRER MA POSITION

</button>


<div id="status">

Prêt.

</div>


<div id="result"
class="result">


<div class="coordinate">

<div class="label">
LATITUDE
</div>

<div id="latitude"
class="value">
</div>

</div>


<div class="coordinate">

<div class="label">
LONGITUDE
</div>

<div id="longitude"
class="value">
</div>

</div>


<div id="accuracy"
class="accuracy">
</div>


<button id="copyButton"
class="copy">

📋 COPIER LA POSITION

</button>


<a id="mapsButton"
class="maps"
target="_blank">

🗺️ OUVRIR DANS GOOGLE MAPS

</a>


</div>


<div class="info">

La position est récupérée directement
par le GPS de votre téléphone.

<br><br>

Vous devez autoriser l'accès à votre
position lorsque le navigateur le demande.

</div>

</div>


<script>


const gpsButton =
document.getElementById("gpsButton");

const status =
document.getElementById("status");

const result =
document.getElementById("result");

const latitude =
document.getElementById("latitude");

const longitude =
document.getElementById("longitude");

const accuracy =
document.getElementById("accuracy");

const copyButton =
document.getElementById("copyButton");

const mapsButton =
document.getElementById("mapsButton");


let positionGPS = "";


gpsButton.addEventListener(
"click",
function() {


result.style.display = "none";

status.className = "";

status.textContent =
"Recherche de votre position…";

gpsButton.disabled = true;


if (!navigator.geolocation) {

status.className = "error";

status.textContent =
"La géolocalisation n'est pas disponible.";

gpsButton.disabled = false;

return;

}


navigator.geolocation.getCurrentPosition(

function(position) {


const lat =
position.coords.latitude;

const lon =
position.coords.longitude;

const precision =
position.coords.accuracy;


latitude.textContent =
lat.toFixed(6);

longitude.textContent =
lon.toFixed(6);


accuracy.textContent =
"Précision estimée : " +
Math.round(precision) +
" mètres";


positionGPS =
lat.toFixed(6) +
", " +
lon.toFixed(6);


mapsButton.href =
"https://www.google.com/maps/search/?api=1&query=" +
encodeURIComponent(lat + "," + lon);


result.style.display =
"block";


status.className =
"ok";

status.textContent =
"Position trouvée ✓";


gpsButton.disabled =
false;

},


function(error) {


let message =
"Impossible de récupérer votre position.";


if (error.code === 1) {

message =
"Accès à la localisation refusé. " +
"Autorisez la localisation.";

}


if (error.code === 2) {

message =
"Position indisponible. " +
"Activez la localisation du téléphone.";

}


if (error.code === 3) {

message =
"Le GPS met trop de temps à répondre. " +
"Veuillez réessayer.";

}


status.className =
"error";

status.textContent =
message;

gpsButton.disabled =
false;

},


{

enableHighAccuracy: true,

timeout: 20000,

maximumAge: 0

}

);

});


copyButton.addEventListener(
"click",
async function() {


if (!positionGPS) {
return;
}


try {

await navigator.clipboard.writeText(
positionGPS
);

copyButton.textContent =
"✓ POSITION COPIÉE";


setTimeout(
function() {

copyButton.textContent =
"📋 COPIER LA POSITION";

},
2000
);


}

catch {

window.prompt(
"Copiez votre position :",
positionGPS
);

}

});


</script>

</body>

</html>
