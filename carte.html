<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Carte des chantiers</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
}

#map {
    width: 100%;
    height: 100%;
}

#titre {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 1000;
    background: white;
    padding: 12px 18px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.20);
    font-weight: bold;
    font-size: 18px;
}

/* ======================================================
   POPUP
   ====================================================== */

.popup {
    min-width: 280px;
    max-width: 380px;
}

.popup-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 12px;
}

.info {
    margin-bottom: 6px;
}

.label {
    font-weight: bold;
}

.gps {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #ddd;
    font-size: 12px;
}

/* ======================================================
   CONTROLE DES FONDS DE CARTE
   ====================================================== */

.leaflet-control-layers {
    border-radius: 10px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.20);
}

</style>

</head>

<body>

<div id="titre">
    🗺️ Carte des chantiers
</div>

<div id="map"></div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

// ======================================================
// RECUPERATION DES DONNEES
// ======================================================

const params =
    new URLSearchParams(
        window.location.search
    );

const donnees =
    params.get("data");


// ======================================================
// CREATION DE LA CARTE
// ======================================================

const map =
    L.map("map");


// ======================================================
// FOND 1 : OPENSTREETMAP
// ======================================================

const fondOSM =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,

            attribution:
                '&copy; OpenStreetMap contributors'
        }
    );


// ======================================================
// FOND 2 : SATELLITE
// ======================================================

const fondSatellite =
    L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom: 19,

            attribution:
                'Tiles &copy; Esri'
        }
    );


// ======================================================
// FOND 3 : TERRAIN / RELIEF
// ======================================================

const fondTerrain =
    L.tileLayer(
        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 17,

            attribution:
                'Map data &copy; OpenStreetMap contributors, SRTM | Map style &copy; OpenTopoMap'
        }
    );


// ======================================================
// FOND PAR DEFAUT
// ======================================================

fondOSM.addTo(map);


// ======================================================
// SELECTION DES FONDS DE CARTE
// ======================================================

const fonds =
    {

        "🗺️ Plan - OpenStreetMap":
            fondOSM,

        "🛰️ Satellite":
            fondSatellite,

        "🏔️ Terrain / Relief":
            fondTerrain

    };


// ======================================================
// AJOUT DU BOUTON DES FONDS
// ======================================================

L.control.layers(
    fonds,
    null,
    {
        collapsed: false,
        position: "topright"
    }
).addTo(map);


// ======================================================
// GROUPE DE MARQUEURS
// ======================================================

const groupe =
    L.featureGroup();


// ======================================================
// SI AUCUNE DONNEE
// ======================================================

if (!donnees) {

    document.getElementById("titre")
        .textContent =
        "⚠️ Aucun chantier transmis";

    map.setView(
        [46.6, 2.4],
        6
    );

}

else {

    try {

        // ==================================================
        // DECODAGE DES DONNEES
        // ==================================================

        const texte =
            decodeURIComponent(donnees);

        const chantiers =
            JSON.parse(texte);


        // ==================================================
        // TITRE
        // ==================================================

        document.getElementById("titre")
            .textContent =
            "🗺️ " +
            chantiers.length +
            " chantier(s)";


        // ==================================================
        // CREATION DES MARQUEURS
        // ==================================================

        chantiers.forEach(function(c) {


            // ==============================================
            // COORDONNEES GPS
            // ==============================================

            const latitude =
                Number(c.lat);

            const longitude =
                Number(c.lon);


            // ==============================================
            // VERIFICATION GPS
            // ==============================================

            if (
                isNaN(latitude) ||
                isNaN(longitude)
            ) {

                return;

            }


            // ==============================================
            // FENETRE DU MARQUEUR
            // ==============================================

            let html =

                '<div class="popup">' +

                '<div class="popup-title">' +

                '📍 Chantier ' +

                echapper(c.chantier) +

                '</div>';


            // ==============================================
            // 1 - HEURE DE DEBUT
            // ==============================================

            html += info(
                "Heure de début",
                c.heure
            );


            // ==============================================
            // 2 - NUMERO DE CHANTIER
            // ==============================================

            html += info(
                "Numéro de chantier",
                c.chantier
            );


            // ==============================================
            // 3 - OPERATION
            // ==============================================

            html += info(
                "Opération",
                c.operation
            );


            // ==============================================
            // 4 - NOM DU PROPRIETAIRE
            // ==============================================

            html += info(
                "Nom du propriétaire",
                c.proprietaire
            );


            // ==============================================
            // 5 - COMMUNE
            // ==============================================

            html += info(
                "Commune",
                c.commune
            );


            // ==============================================
            // 6 - DEPOT
            // ==============================================

            html += info(
                "Dépôt",
                c.depot
            );


            // ==============================================
            // 7 - LONGUEUR
            // ==============================================

            html += info(
                "Longueur",
                c.longueur
            );


            // ==============================================
            // 8 - NUMERO DE PILE
            // ==============================================

            html += info(
                "Numéro de pile",
                c.pile
            );


            // ==============================================
            // 9 - CATEGORIE
            // ==============================================

            html += info(
                "Catégorie",
                c.categorie
            );


            // ==============================================
            // 10 - PRODUITS
            // ==============================================

            html += info(
                "Produits",
                c.produits
            );


            // ==============================================
            // 11 - VOLUME
            // ==============================================

            html += info(
                "Volume",
                c.volume
            );


            // ==============================================
            // 12 - UNITE
            // ==============================================

            html += info(
                "Unité",
                c.unite
            );


            // ==============================================
            // COORDONNEES GPS
            // ==============================================

            html +=

                '<div class="gps">' +

                'Latitude : ' +

                latitude.toFixed(6) +

                '<br>' +

                'Longitude : ' +

                longitude.toFixed(6) +

                '</div>' +

                '</div>';


            // ==============================================
            // CREATION DU MARQUEUR
            // ==============================================

            const marqueur =
                L.marker(
                    [
                        latitude,
                        longitude
                    ]
                );


            // ==============================================
            // FENETRE DU MARQUEUR
            // ==============================================

            marqueur
                .bindPopup(html);


            // ==============================================
            // AJOUT AU GROUPE
            // ==============================================

            marqueur.addTo(
                groupe
            );

        });


        // ==================================================
        // AJOUT DES MARQUEURS A LA CARTE
        // ==================================================

        groupe.addTo(map);


        // ==================================================
        // CENTRAGE AUTOMATIQUE
        // ==================================================

        if (
            groupe.getLayers().length > 0
        ) {

            map.fitBounds(
                groupe.getBounds(),
                {
                    padding: [50, 50]
                }
            );

        }

        else {

            map.setView(
                [46.6, 2.4],
                6
            );

        }

    }

    catch (erreur) {

        console.error(erreur);


        document.getElementById("titre")
            .textContent =
            "❌ Erreur de lecture des chantiers";


        map.setView(
            [46.6, 2.4],
            6
        );

    }

}


// ======================================================
// FONCTION AFFICHER UNE INFORMATION
// ======================================================

function info(
    nom,
    valeur
) {

    if (
        valeur === undefined ||
        valeur === null ||
        valeur === ""
    ) {

        return "";

    }


    return (

        '<div class="info">' +

        '<span class="label">' +

        echapper(nom) +

        ' :</span> ' +

        echapper(
            String(valeur)
        ) +

        '</div>'

    );

}


// ======================================================
// SECURITE HTML
// ======================================================

function echapper(
    texte
) {

    return String(texte)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>

</html>
