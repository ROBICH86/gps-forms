<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Carte des chantiers</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
}

#map {
    width: 100%;
    height: 100%;
}

#titre {

    position: absolute;

    top: 15px;
    left: 15px;

    z-index: 1000;

    background: white;

    padding: 12px 18px;

    border-radius: 12px;

    box-shadow:
        0 3px 15px rgba(0,0,0,0.20);

    font-weight: bold;

    font-size: 18px;
}

.popup {

    min-width: 280px;

    max-width: 360px;

    font-family: Arial, Helvetica, sans-serif;
}

.popup-title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 12px;

    color: #1769e0;
}

.info-row {

    margin-bottom: 7px;

    line-height: 1.35;
}

.info-label {

    font-weight: bold;

    color: #555;
}

.gps {

    margin-top: 12px;

    padding-top: 10px;

    border-top: 1px solid #ddd;

    font-size: 12px;

    color: #666;
}

</style>

</head>

<body>

<div id="titre">
    🗺️ Carte des chantiers
</div>

<div id="map"></div>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

// ============================================================
// RECUPERATION DES DONNEES EXCEL
// ============================================================

const parametres =
    new URLSearchParams(
        window.location.search
    );

let donnees = [];

try {

    const data =
        parametres.get("data");

    if (data) {

        donnees =
            JSON.parse(
                decodeURIComponent(data)
            );

    }

}
catch (erreur) {

    console.error(
        "Erreur données :",
        erreur
    );

}

// ============================================================
// VERIFICATION
// ============================================================

if (
    !Array.isArray(donnees) ||
    donnees.length === 0
) {

    document.getElementById("titre")
        .textContent =
        "⚠️ Aucun chantier sélectionné";

}
else {

    document.getElementById("titre")
        .textContent =
        "🗺️ " +
        donnees.length +
        " chantier(s) sélectionné(s)";

}

// ============================================================
// CREATION DE LA CARTE
// ============================================================

const map =
    L.map("map");


// ============================================================
// FOND OPENSTREETMAP
// ============================================================

L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom: 19,

        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'

    }

).addTo(map);


// ============================================================
// GROUPE DE MARQUEURS
// ============================================================

const groupe =
    L.featureGroup();


// ============================================================
// CREATION DES MARQUEURS
// ============================================================

donnees.forEach(

    function (chantier) {

        const latitude =
            Number(
                chantier.latitude
            );

        const longitude =
            Number(
                chantier.longitude
            );

        if (
            isNaN(latitude) ||
            isNaN(longitude)
        ) {

            return;

        }

        // ----------------------------------------------------
        // NUMERO DE CHANTIER
        // ----------------------------------------------------

        let numero =
            chantier["Numéro de chantier"] ||
            "Chantier";

        // ----------------------------------------------------
        // CONTENU DE LA FENETRE
        // ----------------------------------------------------

        let contenu =

            '<div class="popup">' +

            '<div class="popup-title">' +

            '📍 Chantier ' +

            echapper(
                numero
            ) +

            '</div>';


        // ----------------------------------------------------
        // HEURE DE DEBUT
        // ----------------------------------------------------

        contenu +=
            information(
                "Heure de début",
                chantier["Heure de début"]
            );


        // ----------------------------------------------------
        // NUMERO CHANTIER
        // ----------------------------------------------------

        contenu +=
            information(
                "Numéro de chantier",
                chantier["Numéro de chantier"]
            );


        // ----------------------------------------------------
        // OPERATION
        // ----------------------------------------------------

        contenu +=
            information(
                "Opération",
                chantier["Opération"]
            );


        // ----------------------------------------------------
        // PROPRIETAIRE
        // ----------------------------------------------------

        contenu +=
            information(
                "Nom du propriétaire",
                chantier["Nom du propriétaire"]
            );


        // ----------------------------------------------------
        // COMMUNE
        // ----------------------------------------------------

        contenu +=
            information(
                "Commune",
                chantier["Comunne"]
            );


        // ----------------------------------------------------
        // DEPOT
        // ----------------------------------------------------

        contenu +=
            information(
                "Dépôt",
                chantier["Dépôt"]
            );


        // ----------------------------------------------------
        // LONGUEUR
        // ----------------------------------------------------

        contenu +=
            information(
                "Longueur",
                chantier["Longueur"]
            );


        // ----------------------------------------------------
        // NUMERO DE PILE
        // ----------------------------------------------------

        contenu +=
            information(
                "Numéro de pile",
                chantier["Numéro de pile"]
            );


        // ----------------------------------------------------
        // CATEGORIE
        // ----------------------------------------------------

        contenu +=
            information(
                "Catégorie",
                chantier["Catégorie"]
            );


        // ----------------------------------------------------
        // PRODUITS
        // ----------------------------------------------------

        contenu +=
            information(
                "Produits",
                chantier["Produits"]
            );


        // ----------------------------------------------------
        // VOLUME
        // ----------------------------------------------------

        contenu +=
            information(
                "Volume",
                chantier["Volume"]
            );


        // ----------------------------------------------------
        // UNITE
        // ----------------------------------------------------

        contenu +=
            information(
                "Unité",
                chantier["Unité"]
            );


        // ----------------------------------------------------
        // GPS
        // ----------------------------------------------------

        contenu +=

            '<div class="gps">' +

            'Latitude : ' +
            latitude.toFixed(6) +

            '<br>' +

            'Longitude : ' +
            longitude.toFixed(6) +

            '</div>';


        contenu +=
            '</div>';


        // ----------------------------------------------------
        // MARQUEUR
        // ----------------------------------------------------

        const marqueur =
            L.marker([
                latitude,
                longitude
            ]);


        marqueur
            .bindPopup(
                contenu
            );


        marqueur.addTo(
            groupe
        );

    }

);


// ============================================================
// AJOUTER LES MARQUEURS
// ============================================================

groupe.addTo(map);


// ============================================================
// CENTRER LA CARTE
// ============================================================

if (
    donnees.length > 0 &&
    groupe.getLayers().length > 0
) {

    map.fitBounds(
        groupe.getBounds(),
        {
            padding: [40, 40]
        }
    );

}
else {

    // Position par défaut France
    map.setView(
        [46.6, 2.4],
        6
    );

}


// ============================================================
// FONCTION INFORMATION
// ============================================================

function information(
    nom,
    valeur
) {

    if (
        valeur === undefined ||
        valeur === null ||
        valeur === ""
    ) {

        return "";

    }

    return (

        '<div class="info-row">' +

        '<span class="info-label">' +

        echapper(nom) +

        ' :</span> ' +

        echapper(
            String(valeur)
        ) +

        '</div>'

    );

}


// ============================================================
// PROTECTION HTML
// ============================================================

function echapper(
    texte
) {

    return String(texte)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>

</html>
