<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Carte des chantiers</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
}

#map {
    width: 100%;
    height: 100%;
}

#titre {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 1000;
    background: white;
    padding: 12px 18px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.20);
    font-weight: bold;
    font-size: 18px;
}

.popup {
    min-width: 280px;
    max-width: 380px;
}

.popup-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 12px;
}

.info {
    margin-bottom: 6px;
}

.label {
    font-weight: bold;
}

.gps {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #ddd;
    font-size: 12px;
}

</style>

</head>

<body>

<div id="titre">
    🗺️ Carte des chantiers
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ======================================================
// RECUPERATION DES DONNEES
// ======================================================

const params =
    new URLSearchParams(
        window.location.search
    );

const donnees =
    params.get("data");


// ======================================================
// CARTE
// ======================================================

const map =
    L.map("map");

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution:
            '&copy; OpenStreetMap contributors'
    }
).addTo(map);


// ======================================================
// GROUPE DE MARQUEURS
// ======================================================

const groupe =
    L.featureGroup();


// ======================================================
// SI AUCUNE DONNEE
// ======================================================

if (!donnees) {

    document.getElementById("titre")
        .textContent =
        "⚠️ Aucun chantier transmis";

    map.setView(
        [46.6, 2.4],
        6
    );

}
else {

    try {

        // Décodage
        const texte =
            decodeURIComponent(donnees);

        const chantiers =
            JSON.parse(texte);


        document.getElementById("titre")
            .textContent =
            "🗺️ " +
            chantiers.length +
            " chantier(s)";


        // ==================================================
        // MARQUEURS
        // ==================================================

        chantiers.forEach(function(c) {

            const latitude =
                Number(c.lat);

            const longitude =
                Number(c.lon);

            if (
                isNaN(latitude) ||
                isNaN(longitude)
            ) {
                return;
            }


            // ==============================================
            // FENETRE DU MARQUEUR
            // ==============================================

            let html =

                '<div class="popup">' +

                '<div class="popup-title">' +
                '📍 Chantier ' +
                echapper(c.chantier) +
                '</div>';


            html += info(
                "Heure de début",
                c.heure
            );

            html += info(
                "Numéro de chantier",
                c.chantier
            );

            html += info(
                "Opération",
                c.operation
            );

            html += info(
                "Nom du propriétaire",
                c.proprietaire
            );

            html += info(
                "Commune",
                c.commune
            );

            html += info(
                "Dépôt",
                c.depot
            );

            html += info(
                "Longueur",
                c.longueur
            );

            html += info(
                "Numéro de pile",
                c.pile
            );

            html += info(
                "Catégorie",
                c.categorie
            );

            html += info(
                "Produits",
                c.produits
            );

            html += info(
                "Volume",
                c.volume
            );

            html += info(
                "Unité",
                c.unite
            );


            html +=

                '<div class="gps">' +

                'Latitude : ' +
                latitude.toFixed(6) +

                '<br>' +

                'Longitude : ' +
                longitude.toFixed(6) +

                '</div>' +

                '</div>';


            // ==============================================
            // MARQUEUR
            // ==============================================

            const marqueur =
                L.marker([
                    latitude,
                    longitude
                ]);


            marqueur
                .bindPopup(html);


            marqueur.addTo(
                groupe
            );

        });


        // ==================================================
        // AJOUT DES MARQUEURS
        // ==================================================

        groupe.addTo(map);


        // ==================================================
        // CENTRAGE AUTOMATIQUE
        // ==================================================

        if (
            groupe.getLayers().length > 0
        ) {

            map.fitBounds(
                groupe.getBounds(),
                {
                    padding: [50, 50]
                }
            );

        }
        else {

            map.setView(
                [46.6, 2.4],
                6
            );

        }

    }
    catch (erreur) {

        console.error(erreur);

        document.getElementById("titre")
            .textContent =
            "❌ Erreur de lecture des chantiers";

        map.setView(
            [46.6, 2.4],
            6
        );

    }

}


// ======================================================
// AFFICHER UNE INFORMATION
// ======================================================

function info(
    nom,
    valeur
) {

    if (
        valeur === undefined ||
        valeur === null ||
        valeur === ""
    ) {
        return "";
    }

    return (

        '<div class="info">' +

        '<span class="label">' +
        echapper(nom) +
        ' :</span> ' +

        echapper(
            String(valeur)
        ) +

        '</div>'

    );

}


// ======================================================
// SECURITE HTML
// ======================================================

function echapper(
    texte
) {

    return String(texte)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}

</script>

</body>

</html>
